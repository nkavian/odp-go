name: CI

on:
  pull_request:
  push:
    branches:
      - main

permissions:
  contents: read
  id-token: write

jobs:
  verify:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        go:
          - 1.26.x
          - 1.27.x
    steps:
      - uses: actions/checkout@v7

      - name: Check out ODP specifications
        uses: actions/checkout@v7
        with:
          repository: offering-protocol/odp-specs
          path: .conformance/odp-specs

      - uses: actions/setup-go@v7
        with:
          go-version: ${{ matrix.go }}

      - run: make verify
        env:
          ODP_SPECS_DIR: .conformance/odp-specs

      - name: Upload coverage to Codecov
        if: matrix.go == '1.26.x'
        uses: codecov/codecov-action@v7
        with:
          fail_ci_if_error: true
          files: ./coverage.out
          flags: unit
          name: go-1.26-unit
          use_oidc: true

      - name: Verify clean module consumption
        run: make consumer-smoke

      - name: Run shared conformance harness
        run: make conformance
        env:
          ODP_SPECS_DIR: .conformance/odp-specs

      - name: Upload conformance reports
        if: matrix.go == '1.26.x'
        uses: actions/upload-artifact@v7
        with:
          name: odp-go-conformance
          path: .conformance/reports/*.json
          if-no-files-found: error
          retention-days: 7

      - name: Upload coverage report
        uses: actions/upload-artifact@v7
        with:
          name: odp-go-coverage-go-${{ matrix.go }}
          path: coverage.out
          if-no-files-found: error
          retention-days: 7
